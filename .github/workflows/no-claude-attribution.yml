# Fails a push or pull request if any new commit credits Claude or Anthropic:
# as a co-author, as the author or committer, or with a "Generated with Claude
# Code" line. GitHub squash merges copy co-author lines, so this runs on PRs.
name: no-claude-attribution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check commit messages and identities
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          bad=$(git log --format='%an <%ae>%n%cn <%ce>%n%B' "$range" \
            | grep -iE '^co-authored-by:.*(claude|anthropic)|generated with \[?claude code|^claude-session:|@anthropic\.com>|^claude[^<]*<' || true)
          if [ -n "$bad" ]; then
            echo "These lines credit Claude or Anthropic:"
            echo "$bad"
            exit 1
          fi
          echo "No Claude attribution in $range."
