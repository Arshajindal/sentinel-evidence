[project]
name = "sentinel-evidence"
version = "0.1.0"
description = "Corpus-scale integrity auditing for biomedical research publications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "scipy>=1.12",
    "polars>=0.20",
    "lxml>=5.1",
    "typer>=0.12",
    "structlog>=24.1",
    "tenacity>=8.2",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]
