[project]
name = "sentinel-evidence"
version = "0.1.0"
description = "Corpus-scale integrity auditing for biomedical research publications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "scipy>=1.12",
    "polars>=0.20",
    "lxml>=5.1",
    "typer>=0.12",
    "structlog>=24.1",
    "tenacity>=8.2",
    "pgvector>=0.5.1",  # vector column type for SQLAlchemy Core (ADR-044)
]

[project.scripts]
sentinel = "sentinel.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Phase 2+ experiment tracking and model registry (ADR-043). Kept out of the
# core install so the Phase 1 pipeline and CLI don't pull in MLflow's stack.
ml = [
    "mlflow>=3.17.1",
    "python-dotenv[cli]>=1.0",  # dotenv runs `mlflow server` with .env
    "torch>=2.14.1",  # MedCPT encoders run in-process on CPU (ADR-047)
    "transformers>=5.21.1",
    "bm25s[stem]>=0.3.14",  # BM25 for passage retrieval (ADR-048); MIT
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]
